<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101426">
  <meta name="description" content="MHD AI, assistant intelligent en français.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>MHD AI</title>
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="logo">M</div><div><strong>MHD AI</strong><small>Ton assistant intelligent</small></div></div>
      <button id="installBtn" class="iconbtn" hidden aria-label="Installer">＋ Installer</button>
      <button id="newChatBtn" class="iconbtn" aria-label="Nouvelle discussion">＋ Nouveau</button>
    </header>
    <main id="chat" class="chat" aria-live="polite">
      <section class="welcome" id="welcome">
        <div class="hero-logo">M</div>
        <h1>Bonjour 👋</h1>
        <p>Je suis MHD AI. Pose-moi une question, demande une explication ou aide-toi pour tes exercices.</p>
        <div class="suggestions">
          <button class="suggestion">Explique-moi les bases de Python</button>
          <button class="suggestion">Aide-moi à résoudre un exercice de maths</button>
          <button class="suggestion">Propose un projet de robotique</button>
        </div>
      </section>
    </main>
    <div id="status" class="status" role="status">Prêt à discuter</div>
    <form id="composer" class="composer">
      <textarea id="message" rows="1" placeholder="Écris ton message à MHD AI…" aria-label="Message" required></textarea>
      <div class="composer-bottom">
        <div class="tools">
          <button type="button" id="micBtn" class="toolbtn" title="Dicter un message">🎙️</button>
          <button type="button" id="speakToggle" class="toolbtn" title="Activer ou désactiver la lecture vocale">🔊 Voix</button>
          <select id="model" aria-label="Modèle IA">
            <option value="gpt-5.6-luna">IA avancée</option>
            <option value="deepseek-chat">DeepSeek</option>
            <option value="gemini-2.5-flash">Gemini Flash</option>
          </select>
        </div>
        <button id="sendBtn" type="submit" class="sendbtn">Envoyer ↑</button>
      </div>
    </form>
    <footer>Connexion Internet requise · Les services IA peuvent demander une connexion Puter et avoir des limites gratuites.</footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
